<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ofertas de Prácticas - Plataforma TI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">📚 Prácticas 360</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="ofertas.html">Ver Ofertas</a>
                    </li>
                    <li class="nav-item" id="nav-perfil" style="display:none;">
                        <a class="nav-link" href="profile.html">Mi Perfil</a>
                    </li>
                    <li class="nav-item" id="nav-login">
                        <a class="nav-link" href="#" onclick="showLoginModal(event)">Iniciar Sesión</a>
                    </li>
                    <li class="nav-item" id="nav-logout" style="display:none;">
                        <a class="nav-link" href="#" onclick="logout(event)">Cerrar Sesión</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <h1 style="color: #0D47A1; font-weight: 700; margin-bottom: 2rem;">Ofertas de Prácticas Profesionales</h1>
        <div class="row mb-4">
            <div class="col-md-6">
                <select id="filtro-especialidad" class="form-control">
                    <option value="">-- Todas las especialidades --</option>
                    <option value="Ingeniería de Software">Ingeniería de Software</option>
                    <option value="Ciencia de Datos">Ciencia de Datos</option>
                    <option value="Redes y Telecomunicaciones">Redes y Telecomunicaciones</option>
                    <option value="Ciberseguridad">Ciberseguridad</option>
                    <option value="Inteligencia Artificial">Inteligencia Artificial</option>
                </select>
            </div>
            <div class="col-md-6">
                <button id="btn-filtrar" class="btn btn-primary">🔍 Filtrar</button>
                <button id="btn-limpiar" class="btn btn-secondary">Limpiar</button>
            </div>
        </div>
        <div id="ofertas-container" class="row">
            <!-- Ofertas se cargarán aquí -->
        </div>
    </div>

    <!-- Modal de Login -->
    <div class="modal fade" id="loginModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Iniciar Sesión</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="loginForm">
                        <div class="mb-3">
                            <label for="email" class="form-label">Correo Electrónico</label>
                            <input type="email" class="form-control" id="email" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Contraseña</label>
                            <input type="password" class="form-control" id="password" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Iniciar Sesión</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
